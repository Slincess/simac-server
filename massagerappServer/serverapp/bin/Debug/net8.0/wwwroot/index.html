<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Dashboard</title>
    <link rel="stylesheet" href="/css/style.css" />
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h2 class="Headers">name</h2>
      <button>Dashboard</button>
      <button>Usage</button>
    </div>

    <!-- Main area -->
    <div class="main">
      <div class="server-info">
        <div>
          <div>IP</div>
          <div>port</div>
        </div>
        <button id="ServerStatButton" onclick="OpenOrCloseServer()">
          stop server
        </button>
      </div>

      <script>
        async function OpenOrCloseServer() {
          const button = document.getElementById("ServerStatButton");

          let isRunning = await (await fetch("/api/running")).json();

          if (isRunning) {
              await fetch("/api/CloseServer");
            button.textContent = "Run";
          } else {
            await fetch("/api/StartServer");
            button.textContent = "Close";
          }

            // CCU EventSource
            const sourceCCU = new EventSource("/api/GetCCU");
            sourceCCU.onmessage = (event) => {
                const data = JSON.parse(event.data);
                const list = document.querySelector(".panel.small .scrollview ul"); // explicitly CCU ul
                const users = data.SV_CCU;
                list.innerHTML = "";

                users.forEach(user => {
                    const li = document.createElement("li");
                    li.textContent = user.CL_Name; // make sure to use CL_Name
                    list.appendChild(li);
                });
            };

            // Messages EventSource
            const sourceMessage = new EventSource("/api/GetMessage");
            sourceMessage.onmessage = (event) => {
                const data = JSON.parse(event.data); // object with SV_allMessages
                const messages = data.SV_allMessages;
                const chatBox = document.getElementById("chatMessages");
                chatBox.innerHTML = ""; // clear previous messages if needed

                messages.forEach(msg => {
                    const p = document.createElement("p");
                    p.innerHTML = `<b>${msg.Sender}:</b> ${msg.Message}`;
                    chatBox.appendChild(p);
                });

                chatBox.scrollTop = chatBox.scrollHeight;
            };

        }
      </script>

      <div class="content">
          <!-- CCU Panel -->
          <div class="panel small">
              <h3>CCU</h3>
              <div class="scrollview">
                  <ul>
                      <li>User 1</li>
                      <li>User 2</li>
                      <li>User 3</li>
                      <li>User 4</li>
                      <li>User 5</li>
                      <li>User 6</li>
                      <li>User 7</li>
                      <li>User 8</li>
                      <li>User 9</li>
                      <li>User 10</li>
                  </ul>
              </div>
          </div>

          <!-- Active Chat Panel -->
          <div class="panel chat">
              <h3>active chat</h3>
              <div class="scrollview" id="chatMessages">
                  <!-- Messages will be appended here -->
              </div>
          </div>
      </div>
    </div>
  </body>
</html>
